<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اطلب اين ماكنت - Talabak</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--orange:#ff6b00;--bg:#fffaf5}
*{box-sizing:border-box;font-family:system-ui,Tahoma}
body{margin:0;background:var(--bg);padding-bottom:100px}
header{text-align:center;padding:28px 15px;background:#fff;border-bottom:1px solid #eee}
h1{margin:0;font-size:34px}
.btn{border:none;padding:13px 22px;border-radius:30px;font-weight:800;cursor:pointer}
.btn-o{background:var(--orange);color:#fff}
.btn-b{background:#111;color:#fff}
.city-wrap{display:flex;gap:10px;justify-content:center;margin:18px}
.city{padding:14px 22px;border-radius:14px;border:2px solid #eee;background:#fff;cursor:pointer;font-weight:700}
.city.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.card{background:#fff;border-radius:18px;padding:14px 16px;margin:10px 12px;box-shadow:0 4px 20px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center}
.view{background:#111;color:#fff;border:none;border-radius:12px;padding:9px 14px;cursor:pointer}
.trash{background:#ffeaea;color:#c00;border:none;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:700}
.admin{margin:12px;background:#fff;border-radius:18px;padding:16px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1.5px solid #e5e5e5;margin:6px 0}
footer{text-align:center;color:#999;padding:20px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>اطلب اين ماكنت</h1>
<div>اطلب أشهى المأكولات - بنكك: <b>2505206</b> - واتساب: <b>0125048800</b></div>
<div style="margin-top:14px">
<button class="btn btn-b" onclick="showReg()">+ سجل كافتيريا</button>
<button class="btn btn-b" style="background:#111;margin-right:6px" onclick="showManage()">⚙️ إدارة / حذف</button>
</div>
</header>
<div class="city-wrap">
<div class="city active" id="c-dandar" onclick="setCity('الدندر')">📍 الدندر - متاح الآن</div>
<div class="city" id="c-kh" onclick="setCity('الخرطوم')">الخرطوم</div>
</div>
<div id="shops"></div>
<div id="reg" class="admin" style="display:none">
<h3>تسجيل كافتيريا - اطلب اين ماكنت</h3>
<input id="s_name" placeholder="اسم الكافتيريا">
<input id="s_phone" placeholder="رقم الواتساب 09xx">
<select id="s_city"><option>الدندر</option><option>الخرطوم</option></select>
<textarea id="s_menu" rows="3" placeholder="المنيو: شية 7000, سمك 10000"></textarea>
<button class="btn btn-o" onclick="addShop()" style="width:100%">حفظ ✅</button>
<button class="btn btn-b" onclick="hideReg()" style="width:100%;margin-top:6px;background:#eee;color:#111">إغلاق</button>
</div>
<div id="manage" class="admin" style="display:none">
<h3>⚙️ إدارة - حذف كافتيريا واحدة</h3>
<div id="manageList"></div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-b" onclick="hideManage()" style="flex:1">رجوع</button>
<button class="btn btn-o" style="flex:1;background:#d00" onclick="clearDup()">🧹 مسح المكرر</button>
</div>
</div>
<footer>اطلب اين ماكنت - v2.0</footer>
<script src="app.js"></script>
</body>
  </html>
